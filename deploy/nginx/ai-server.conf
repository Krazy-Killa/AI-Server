# AI Server LAN entry point (HTTPS reverse proxy). Install as
# /etc/nginx/conf.d/ai-server.conf. The backend (8000) and dashboard (8001) stay
# bound to 127.0.0.1; only this proxy listens on the LAN.
#
# The browser must use one origin for the dashboard, REST API, and WebSocket.
# Add that exact origin (for example https://LAB_HOST) to AI_SERVER_CORS_ORIGINS.

# Per-client throttle for login attempts. The backend sees every proxied request
# from the proxy, so its own per-client login limit cannot tell LAN clients apart.
limit_req_zone $binary_remote_addr zone=ai_server_login:1m rate=6r/m;

map $http_upgrade $ai_server_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/ai-server/tls/server.crt;
    ssl_certificate_key /etc/ai-server/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_timeout 1h;
    ssl_session_cache   shared:ai_server_tls:1m;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location = /api/auth/login {
        limit_req zone=ai_server_login burst=4 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass http://127.0.0.1:8000;
    }

    location @login_limited {
        default_type application/json;
        return 429 '{"detail":"Too many login attempts. Try again later."}';
    }

    # Signed release-bundle upload: larger body, streamed straight to the backend,
    # which enforces its own size limit (AI_SERVER_UPDATE_MAX_BYTES).
    location = /api/admin/updates {
        client_max_body_size 130m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai_server_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
    }
}
