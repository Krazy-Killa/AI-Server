site_name: AI Server Documentation
site_description: Guides and project status for the AI Command Interface
site_url: https://krazy-killa.github.io/AI-Server/
repo_url: https://github.com/Krazy-Killa/AI-Server
repo_name: Krazy-Killa/AI-Server

validation:
  links:
    anchors: warn

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/dashboard.css

nav:
  - Home: README.md
  - Project context: project-context.md
  - Roadmap: roadmap/README.md
  - Architecture:
      - System architecture: architecture/README.md
      - Project overview: architecture/overview.md
  - Backend & Frontend:
      - Backend overview: backend/README.md
      - API reference: backend/api.md
      - Frontend: frontend/README.md
  - Security:
      - Security overview: security/README.md
      - Authentication and sessions: security/authentication.md
  - Operations:
      - Operations overview: operations/README.md
      - Configuration: operations/configuration.md
      - Testing environment: operations/testing-environment.md
      - Infrastructure contracts: operations/infrastructure-contracts.md
  - Deployment:
      - Deployment overview: deployment/README.md
      - Linux and Proxmox runbook: deployment/linux-proxmox-transition.md
  - Diagnostics:
      - Diagnostics overview: diagnostics/README.md
      - Diagnostics and self-healing design: diagnostics/ai-diagnostics-self-healing.md
  - GPU:
      - GPU overview: gpu/README.md
      - GPU integration plan: gpu/gpu-plan.md

markdown_extensions:
  - tables
  - fenced_code
